<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Media Downloader</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content wow fadeInDown">
          <div class="app-icon">
            <i class="fas fa-music"></i>
          </div>
          <h1>Media Downloader</h1>
        </div>
      </header>

      <main>
        <div class="download-section">
          <div class="input-wrapper wow fadeInLeft" data-wow-delay="0.2s">
            <i class="fas fa-link input-icon"></i>
            <input
              type="url"
              id="video-url"
              placeholder="Video URL'sini buraya yapıştırın"
              required
            />
          </div>

          <!-- Format Seçici -->
          <div class="format-selector wow fadeInUp" data-wow-delay="0.4s">
            <div class="format-option">
              <input
                type="radio"
                id="mp3-format"
                name="format"
                value="mp3"
                checked
              />
              <label for="mp3-format">
                <i class="fas fa-file-audio"></i>
                MP3
              </label>
            </div>
            <div class="format-option">
              <input type="radio" id="mp4-format" name="format" value="mp4" />
              <label for="mp4-format">
                <i class="fas fa-file-video"></i>
                MP4
              </label>
            </div>
          </div>

          <button
            id="download-btn"
            class="download-btn wow pulse"
            data-wow-iteration="2"
          >
            <i class="fas fa-download"></i>
            İndir
          </button>

          <div
            id="status-message"
            class="status-message wow fadeIn"
            data-wow-delay="0.6s"
          ></div>
        </div>
      </main>

      <footer class="wow fadeInUp" data-wow-delay="0.8s">
        <p>
          <i class="fas fa-shield-alt"></i>
          Telif hakları konusunda dikkatli olun
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.0.2/wow.min.js"></script>
  </body>
</html>
